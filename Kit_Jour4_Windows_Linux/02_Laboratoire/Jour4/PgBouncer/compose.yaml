services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: pooling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin-lab-local
    command: [postgres, -c, max_connections=60]
    volumes:
      - pooling_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d pooling"]
      interval: 2s
      timeout: 3s
      retries: 30
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=atelier-local psql -h 127.0.0.1 -p 6432 -U atelier -d pooling -Atc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 30
  bench:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command: [sleep, infinity]
    environment:
      PGPASSWORD: atelier-local
      PGAPPNAME: j4_charge
      PGCONNECT_TIMEOUT: '10'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pooling_data:
networks:
  default:
    internal: true
