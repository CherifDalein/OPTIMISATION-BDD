[databases]
pooling = host=db port=5432 dbname=pooling

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = observateur
pool_mode = transaction
default_pool_size = 5
reserve_pool_size = 0
max_client_conn = 200
query_wait_timeout = 30
server_connect_timeout = 10
stats_period = 5
log_connections = 0
log_disconnections = 0
